<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Best Job</title>
<meta name="google-site-verification" content="ql5iCQlE3fS_5FshpZWN54nE3ISZ5xK-URVPubaoddI">
<link rel="canonical" href="https://thebestjob.org/">
</head>
<body>
<p id="msg" style="font-family:system-ui,sans-serif;text-align:center;margin-top:3rem;color:#555">Caricamento del sito…</p>
<script>
(async function () {
  try {
    // Restore from last complete publish on this repo
    const r = await fetch("https://cdn.jsdelivr.net/gh/stefanosupernet-sudo/the-best-job@da47574f3d1ec8137f4980b434752501b8a5ec2d/index.html");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const html = await r.text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById("msg").innerHTML = "Errore di caricamento. <a href=\"https://github.com/stefanosupernet-sudo/the-best-job\">Apri il repository</a><br>" + e.message;
  }
})();
</script>
</body>
</html>
