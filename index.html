<body>
<p id="msg" style="font-family:system-ui,sans-serif;text-align:center;margin-top:3rem;color:#555">Caricamento del sito…</p>
<script>
(async function () {
  try {
    const parts = await Promise.all([fetch("payload.0.b64").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}),fetch("payload.1.b64").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}),fetch("payload.2.b64").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}),fetch("payload.3.b64").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}),fetch("payload.4.b64").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}),fetch("payload.5.b64").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}),fetch("payload.6.b64").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}),fetch("payload.7.b64").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}),fetch("payload.8.b64").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}),fetch("payload.9.b64").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}),fetch("payload.10.b64").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}),fetch("payload.11.b64").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}),fetch("payload.12.b64").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}),fetch("payload.13.b64").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()})]);
    const b64 = parts.join("").replace(/\s+/g, "");
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    if (typeof DecompressionStream === "undefined") {
      document.getElementById("msg").textContent = "Browser non supportato. Usa Chrome, Firefox o Safari aggiornati.";
      return;
    }
    const ds = new DecompressionStream("gzip");
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById("msg").textContent = "Errore: " + e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
