name: Assemble QR article
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/assemble-qr-article.yml'
jobs:
  a:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat _chunks/qr_html_0.txt _chunks/qr_html_1.txt _chunks/qr_html_2.txt _chunks/qr_html_3.txt > servizi/codici-qr-intelligenti/index.html
          wc -c servizi/codici-qr-intelligenti/index.html
          head -c 100 servizi/codici-qr-intelligenti/index.html
          git config user.name stefano-thebestjob
          git config user.email stefano@thebestjob.org
          git add servizi/codici-qr-intelligenti/index.html
          git rm -f _chunks/qr_html_*.txt .github/workflows/assemble-qr-article.yml
          git commit -m "QR Code nel Logo: articolo SEO/AEO/GEO su codici-qr-intelligenti"
          git push
