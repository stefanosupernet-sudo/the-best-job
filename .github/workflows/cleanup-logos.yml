name: Cleanup logos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cleanup-logos.yml'
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Copy SEO logo to root and remove junk
        run: |
          set -e
          # Copy SEO-friendly logo to root if present in logo-new
          if [ -f logo-new/the-best-job-logo.webp ]; then
            cp logo-new/the-best-job-logo.webp the-best-job-logo.webp
            echo "Copied the-best-job-logo.webp to root"
          fi
          if [ -f logo-new/the-best-job-logo.png ]; then
            cp logo-new/the-best-job-logo.png the-best-job-logo.png
            echo "Copied the-best-job-logo.png to root"
          fi
          # Prefer logo-new versions for header if larger/better
          for f in logo-header.webp logo-header.png "logo-header@2x.webp" "logo-header@2x.png" logo.webp logo.png; do
            if [ -f "logo-new/$f" ]; then
              cp "logo-new/$f" "$f"
              echo "Synced $f from logo-new"
            fi
          done
          # Remove residual base64 / junk files
          rm -f logo-header.webp.b64 "logo-header@2x.webp.b64" p0.b64 payload.0.b64 payload.1.b64 site.a.b64
          rm -f logo*.b64 payload*.b64 p0.b64 site.a.b64 2>/dev/null || true
          ls -la the-best-job-logo.webp the-best-job-logo.png logo-header.webp 2>/dev/null || true
      - name: Commit and push
        run: |
          git config user.name "stefano-thebestjob"
          git config user.email "stefano@thebestjob.org"
          git add -A
          git status
          git commit -m "Add the-best-job-logo to root, sync logos from logo-new, remove residual .b64 files" || echo "No changes"
          git push
          git rm -f .github/workflows/cleanup-logos.yml
          git commit -m "Remove temporary cleanup workflow" || true
          git push || true
