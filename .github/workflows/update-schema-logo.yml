name: Update schema.org logo
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-schema-logo.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace schema logo URL in all HTML
        run: |
          python3 << 'PY'
          from pathlib import Path

          old = 'https://thebestjob.org/logo.png'
          new = 'https://thebestjob.org/the-best-job-logo.webp'

          # Also catch relative / logo.png in JSON-LD logo field only via full URL
          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  continue
              # Prefer replacing only schema logo field when possible
              count_schema = text.count(f'"logo": "{old}"')
              new_text = text.replace(f'"logo": "{old}"', f'"logo": "{new}"')
              # Also plain occurrences of the absolute logo.png URL in JSON-LD contexts
              # Avoid changing <link rel="icon" ... href="logo.png"> — those stay as favicon
              path.write_text(new_text, encoding='utf-8')
              changed.append(f'{path} (schema logo: {count_schema})')

          print('Updated files:')
          for c in changed:
              print(' ', c)
          print('Total:', len(changed))
          PY
      - name: Commit and push
        run: |
          git config user.name "stefano-thebestjob"
          git config user.email "stefano@thebestjob.org"
          git add -A '*.html'
          git status
          git commit -m "Update schema.org logo to the-best-job-logo.webp on all pages" || echo "No changes"
          git push
          git rm -f .github/workflows/update-schema-logo.yml
          git commit -m "Remove temporary schema logo workflow" || true
          git push || true
