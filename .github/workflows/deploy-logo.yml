name: Deploy new logo
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-logo.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write logo files from base64
        run: |
          python3 << 'PY'
          import base64, pathlib
          files = {
            'logo-header.webp': '''PLACEHOLDER_HEADER_1X''',
            'logo-header@2x.webp': '''PLACEHOLDER_HEADER_2X''',
            'logo-header.png': '''PLACEHOLDER_HEADER_PNG''',
            'logo-header@2x.png': '''PLACEHOLDER_HEADER_PNG_2X''',
            'logo.webp': '''PLACEHOLDER_LOGO_WEBP''',
            'logo.png': '''PLACEHOLDER_LOGO_PNG''',
            'the-best-job-logo.webp': '''PLACEHOLDER_SEO_WEBP''',
            'the-best-job-logo.png': '''PLACEHOLDER_SEO_PNG''',
          }
          for path, b64 in files.items():
              data = base64.b64decode(b64)
              pathlib.Path(path).write_bytes(data)
              print(path, len(data))
          PY
      - name: Commit and push logos
        run: |
          git config user.name "stefano-thebestjob"
          git config user.email "stefano@thebestjob.org"
          git add logo-header.webp "logo-header@2x.webp" logo-header.png "logo-header@2x.png" logo.webp logo.png the-best-job-logo.webp the-best-job-logo.png
          git commit -m "Add new brand logo (WebP + PNG, SEO-friendly names, header sizes)" || echo "No changes"
          git push
      - name: Cleanup workflow
        run: |
          git rm .github/workflows/deploy-logo.yml
          git commit -m "Remove temporary logo deploy workflow" || true
          git push || true
