name: Deploy new logo
on:
  workflow_dispatch:
  push:
    paths:
      - 'logo-header.webp.b64'
      - '.github/workflows/deploy-logo.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 logos to binary
        run: |
          python3 << 'PY'
          import base64, pathlib
          for p in pathlib.Path('.').glob('logo*.b64'):
              out = p.name[:-4]  # strip .b64
              data = base64.b64decode(p.read_text().strip())
              pathlib.Path(out).write_bytes(data)
              print('wrote', out, len(data))
          PY
      - name: Commit binary logos and cleanup
        run: |
          git config user.name "stefano-thebestjob"
          git config user.email "stefano@thebestjob.org"
          git add logo-header.webp "logo-header@2x.webp" logo-header.png "logo-header@2x.png" 2>/dev/null || true
          git add logo*.webp logo*.png 2>/dev/null || true
          git rm -f logo*.b64 2>/dev/null || true
          git rm -f "logo the best job.png" 2>/dev/null || true
          git commit -m "Deploy new brand logo (WebP/PNG header, SEO-friendly)" || echo "no changes"
          git push
          git rm -f .github/workflows/deploy-logo.yml
          git commit -m "Remove temporary logo deploy workflow" || true
          git push || true
