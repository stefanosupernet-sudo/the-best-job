name: Update logo attributes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-logo-attrs.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update logo img width/height and alt SEO in all HTML
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          # Match the logo <img> tag used in header
          old_pat = re.compile(
              r'(<img\s+src="/logo-header\.png"\s+srcset="/logo-header\.png 1x, /logo-header@2x\.png 2x"\s+alt=")The Best Job("\s+width=")62("\s+height="40"\s+decoding="async"\s+fetchpriority="high">)',
              re.IGNORECASE
          )
          new_alt = 'The Best Job — International Growth, Digital Transformation, AI'
          replacement = r'\g<1>' + new_alt + r'\g<2>60\g<3>'

          # Also catch slight variants (single quotes, different order)
          old_pat2 = re.compile(
              r'alt="The Best Job"(\s+)width="62"(\s+)height="40"',
          )
          replacement2 = f'alt="{new_alt}"\1width="60"\2height="40"'

          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              new_text, n1 = old_pat.subn(replacement, text)
              new_text, n2 = old_pat2.subn(replacement2, new_text)
              if n1 or n2:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(f'{path} (matches: {n1+n2})')

          print('Updated files:')
          for c in changed:
              print(' ', c)
          print('Total:', len(changed))
          PY
      - name: Commit and push
        run: |
          git config user.name "stefano-thebestjob"
          git config user.email "stefano@thebestjob.org"
          git add -A '*.html'
          git status
          git commit -m "Update logo dimensions to 60x40 and SEO alt text on all pages" || echo "No changes"
          git push
          git rm -f .github/workflows/update-logo-attrs.yml
          git commit -m "Remove temporary logo attrs workflow" || true
          git push || true
