name: Install GA4 Consent Mode
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-ga-consent.yml'
jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch all HTML
        run: |
          python3 -c "import base64,pathlib; pathlib.Path('/tmp/tbj_ga_patch.py').write_bytes(base64.b64decode(''))"
          python3 /tmp/tbj_ga_patch.py
          grep -n "G-JC31K942H0" index.html | head -5
          grep -n "consent" index.html | head -8
      - name: Commit
        run: |
          git config user.name stefano-thebestjob
          git config user.email stefano@thebestjob.org
          git add -A
          git status --short | head -80
          git commit -m "Install GA4 G-JC31K942H0 + Google Consent Mode v2 site-wide" || echo no changes
          git push
          git rm -f .github/workflows/install-ga-consent.yml
          git commit -m "Remove temporary GA install workflow" || true
          git push || true
