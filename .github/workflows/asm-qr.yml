name: Assemble QR HTML from b64 parts
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/asm-qr.yml'
      - '_chunks/b64p3.txt'
jobs:
  a:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -c "
          import base64, pathlib
          b=''.join(pathlib.Path(f'_chunks/b64p{i}.txt').read_text() for i in range(4))
          pathlib.Path('servizi/codici-qr-intelligenti/index.html').write_bytes(base64.b64decode(b))
          print(pathlib.Path('servizi/codici-qr-intelligenti/index.html').stat().st_size)
          "
          git config user.name stefano-thebestjob
          git config user.email stefano@thebestjob.org
          git add servizi/codici-qr-intelligenti/index.html
          git rm -rf _chunks .github/workflows/asm-qr.yml .github/workflows/deploy-qr-html.yml || true
          git commit -m "Restore QR Code nel Logo article (full HTML)"
          git push
